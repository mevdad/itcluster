name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # daily rebuild: the footer year is fixed at build time

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Build static site
        run: npm run build:pages
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH != '' && vars.PAGES_BASE_PATH || format('/{0}', github.event.repository.name) }}
          # Repository variables (Settings → Secrets and variables → Actions → Variables):
          #   LEAD_ENDPOINT  — URL of the deployed Cloudflare Worker (workers/lead); empty → the form says "not connected"
          #   DEMO           — "0" (default) builds the public site; "1" is an internal preview with placeholders + noindex
          #   CONTACT_EMAIL / CONTACT_PHONE — public contacts
          LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT }}
          DEMO: ${{ vars.DEMO != '' && vars.DEMO || '0' }}
          # ECONOMICS — "1" (default here) shows the «Экономика» blocks (tariffs + stack economics) on the landing; "0" hides them.
          # They run on example prices and say so on the page: set "0" or replace the numbers before a real launch.
          NEXT_PUBLIC_ECONOMICS: ${{ vars.ECONOMICS != '' && vars.ECONOMICS || '1' }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          NEXT_PUBLIC_CONTACT_PHONE: ${{ vars.CONTACT_PHONE }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
